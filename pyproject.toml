typing-extensions = "4.15.0"
tzdata = "2025.2"
uc-micro-py = "1.0.3"
urllib3 = "2.5.0"
userpath = "1.9.2"
uvicorn = "0.35.0"
watchfiles = "1.1.0"
websockets = "15.0.1"
win32-setctime = "1.2.0"
yarl = "1.20.1"
zstandard = "0.24.0"
lxml = ">=6.0.2"
isort = "^7.0.0"
toml = "^0.10.2"

[tool.nonebot]
adapters = [
    {name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"},
]
plugins = ["nonebot_plugin_epicfree", "nonebot_plugin_bilibilibot"]
plugin_dirs = ["plugins"]
builtin_plugins = []
